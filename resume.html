<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026｜作品集简历</title>
    <style>
      :root {
        --resume-width: 1080px;
        --resume-height: 1952px;
        --page-bg: #f3f1ed;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page-bg);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 0;
        font-family:
          "SF Pro Display",
          "SF Pro Text",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
      }

      .resume-shell {
        width: min(100%, var(--resume-width));
      }

      .resume-canvas {
        position: relative;
        width: 100%;
        aspect-ratio: 1080 / 1952;
        overflow: hidden;
        background: #ffffff;
      }

      .resume-canvas img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .sr-text {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 720px) {
        body {
          padding: 0;
        }

        .resume-shell {
          width: 100%;
        }

        .resume-canvas {
          box-shadow: none;
        }
      }

      @media print {
        @page {
          size: 1080px 1952px;
          margin: 0;
        }

        html,
        body {
          width: var(--resume-width);
          height: var(--resume-height);
          background: #ffffff;
          padding: 0;
        }

        body {
          display: block;
        }

        .resume-shell,
        .resume-canvas {
          width: var(--resume-width);
          height: var(--resume-height);
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="resume-shell" aria-label="吴彦霖 2026 简历">
      <section class="resume-canvas">
        <img
          src="./assets/figma-resume-2026.png"
          srcset="
            ./assets/figma-resume-2026.png    1x,
            ./assets/figma-resume-2026@2x.png 2x,
            ./assets/figma-resume-2026@4x.png 4x
          "
          width="1080"
          height="1952"
          alt="吴彦霖 2026 简历，求职意向为 AI-交易产品设计师"
        />
        <div class="sr-text">
          吴彦霖 Yanlin Wu。求职意向：AI-交易产品设计师。方向：交易信任体验设计、商业增长产品设计、AI 工作流实践。
        </div>
      </section>
    </main>
  </body>
</html>
